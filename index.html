<script>
// =====================================================================
// 1. CASO DE REFERENCIA «EL PLAN» (Cerón-Muñoz y Guarín, 2025, caps. 3-4)
//    Calibrado para reproducir: precio $2.108/L, costo $1.750/L,
//    margen 17,0 %, alimentación 35,4 %, mano de obra 12,3 %,
//    ingresos $2.003 M, inversión $1.342 M, ROI leche ≈ 24 %.
//    Todos los valores monetarios se registran en $/año.
// =====================================================================
const CASO_EL_PLAN = {
  vacas:114, area:125, volumen:902300, precio_leche:2108, empleados:7,
  sistema_produccion:'Pastoreo con suplementación', novillas:101,
  region:'San Pedro de los Milagros', valor_hectarea:5000000, ensilaje:42,
  potencial_genetico:25,
  // Ingresos
  venta_leche:0, venta_animales:64680000, venta_estiercol:0, otros_ingresos:0,
  cambio_stock_animales:27500000, cambio_stock_alimentos:9000000,
  // Gastos básicos (variables)
  mantenimiento_maquinas:45000000, mantenimiento_instalaciones:45000000, alquiler_maquinas:40000000,
  energia:90000000, alimentos_comprados:559025000, correctivos_fertilizantes:90000000,
  productos_quimicos:22000000, semillas:18000000, reproduccion:35000000, salud:55000000,
  consumibles:50000000, bst:30000000, impuestos:42000000, otros_gastos_basicos:40670000,
  // Gastos adicionales (fijos)
  mano_obra_fija:162000000, mano_obra_temporal:32200000, administracion:96000000,
  intereses_prestamos:45000000,
  depreciacion_maquinaria:0, depreciacion_instalaciones:0, depreciacion_animales:0,
  // Inversiones y financiación
  inversiones_instalaciones:192000000, inversiones_maquinaria:132500000,
  inversiones_animales:0, inversiones_tierra:0,
  precio_vaca:2600000, precio_novilla:955000, deuda:300000000,
  tasa_dep_vacas:20, tasa_dep_instalaciones:5, tasa_dep_maquinaria:10
};

const KEYS_BASICOS = ['mantenimiento_maquinas','mantenimiento_instalaciones','alquiler_maquinas','energia',
  'alimentos_comprados','correctivos_fertilizantes','productos_quimicos','semillas','reproduccion','salud',
  'consumibles','bst','impuestos','otros_gastos_basicos'];
const KEYS_BASICOS_NO_ALIM = KEYS_BASICOS.filter(k => k !== 'alimentos_comprados');

const SIM_CERO = {precio:0, alim:0, prod:0, mo:0, otros:0, animales:0};
const PESOS = {productividad:0.25, alimentacion:0.20, calidad:0.20, sanidad:0.20, reproductiva:0.15};
const DIV = {anual:1, semestral:2, trimestral:4};
const NOMBRES_SUB = {
  anual:['Año completo'],
  semestral:['Semestre 1 (ene–jun)','Semestre 2 (jul–dic)'],
  trimestral:['Trimestre 1 (ene–mar)','Trimestre 2 (abr–jun)','Trimestre 3 (jul–sep)','Trimestre 4 (oct–dic)']
};
const CORTO_SUB = {anual:['Año'], semestral:['S1','S2'], trimestral:['T1','T2','T3','T4']};

// Estado
let appData = JSON.parse(JSON.stringify(CASO_EL_PLAN));
let periodo = {tipo:'anual', sub:0};
let estac = {semestral:{prod:[0,0],precio:[0,0],alim:[0,0]}, trimestral:{prod:[0,0,0,0],precio:[0,0,0,0],alim:[0,0,0,0]}};
let sim = {...SIM_CERO};
let sens = {precio:15, alim:20, prod:10, mo:10};
let mc = {sdPrecio:10, sdAlim:10, sdProd:5, n:2000, resultado:null};
let plan = {metaMargen:19.8, caidaPrecio:15, horizonte:5, crecPrecio:3, inflCostos:4.5, mejoraProd:1.5, tasaDesc:12};
let diag = {alimentacion:0.80, calidad:0.85, sanidad:0.80, reproductiva:0.75};
let eqFactor = 1;   // 1 = convención del libro (1 L de leche EQ = 1 kg); 1.032 = densidad
let escenarios = [];
let activeTab = 'datos_generales';
let aiAnalysis = null, isAnalyzing = false;
let savedSections = new Set();

const tabs = [
  {id:'datos_generales', label:'Datos Generales', icon:'calculator', order:0},
  {id:'ingresos', label:'Ingresos', icon:'trending-up', order:1},
  {id:'gastos', label:'Gastos', icon:'dollar-sign', order:2},
  {id:'inversiones', label:'Inversiones', icon:'pie-chart', order:3},
  {id:'resultados', label:'Resultados', icon:'bar-chart-3', order:4},
  {id:'indicadores_eq', label:'Indicadores 100 kg EQ', icon:'gauge', order:5},
  {id:'diagnostico', label:'Diagnóstico', icon:'activity', order:6},
  {id:'simulador', label:'Simulador', icon:'sliders', order:7},
  {id:'planificacion', label:'Planificación', icon:'target', order:8},
  {id:'analisis', label:'Análisis IA', icon:'brain', order:9}
];

// =====================================================================
// 2. FORMATO Y UTILIDADES
// =====================================================================
function fmtCOP(v){ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(isFinite(v)?v:0); }
function fmtNum(v,d=0){ return new Intl.NumberFormat('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d}).format(isFinite(v)?v:0); }
function fmtPct(v,d=1){ return fmtNum(v*100,d)+' %'; }
function fmtSigned(v,d=1,suf=' %'){ const s = v>0?'+':(v<0?'−':''); return s+fmtNum(Math.abs(v),d)+suf; }
function fmtMill(v){ return (v<0?'−':'')+'$'+fmtNum(Math.abs(v)/1e6,1)+' M'; }
const formatCurrency = fmtCOP;
const formatNumber = v => fmtNum(v);
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function descargar(contenido, nombre, tipo){
  const blob = new Blob([contenido], {type:tipo});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function etiquetaPeriodo(){ return periodo.tipo==='anual' ? 'Anualizado (12 meses)' : NOMBRES_SUB[periodo.tipo][periodo.sub]; }
function porPeriodo(){ return {anual:'/año', semestral:'/semestre', trimestral:'/trimestre'}[periodo.tipo]; }

// =====================================================================
// 3. MODELO DE CÁLCULO
// =====================================================================
function calculateAutomaticValues(){
  const d = appData;
  d.venta_leche = d.volumen * d.precio_leche;
  d.inversiones_animales = d.vacas*d.precio_vaca + d.novillas*d.precio_novilla;
  d.inversiones_tierra = d.area * d.valor_hectarea;
  d.depreciacion_maquinaria = d.inversiones_maquinaria * d.tasa_dep_maquinaria/100;
  d.depreciacion_instalaciones = d.inversiones_instalaciones * d.tasa_dep_instalaciones/100;
  d.depreciacion_animales = d.vacas * d.precio_vaca * d.tasa_dep_vacas/100;
}

/**
 * Modelo bioeconómico del periodo.
 * s: choques del escenario (fracciones). k: subperiodo. tipo: anual|semestral|trimestral.
 * Supuestos: los flujos anuales se reparten proporcionalmente y se ajustan con δt;
 * al cambiar la productividad, el costo total no cambia (taller de sensibilidad).
 */
function modelo(s = SIM_CERO, k = periodo.sub, tipo = periodo.tipo){
  calculateAutomaticValues();
  const d = appData, n = DIV[tipo], f = 1/n, dias = 365*f;
  const e = tipo==='anual' ? {prod:0,precio:0,alim:0}
    : {prod:estac[tipo].prod[k]/100, precio:estac[tipo].precio[k]/100, alim:estac[tipo].alim[k]/100};

  const volumen = d.volumen*f*(1+s.prod)*(1+e.prod);
  const precio = d.precio_leche*(1+s.precio)*(1+e.precio);
  const venta_leche = volumen*precio;
  const venta_animales = d.venta_animales*f*(1+s.animales);
  const venta_estiercol = d.venta_estiercol*f;
  const otros_ingresos = d.otros_ingresos*f;
  const cambio_stock_animales = d.cambio_stock_animales*f;
  const cambio_stock_alimentos = d.cambio_stock_alimentos*f;
  const total_ingresos = venta_leche+venta_animales+venta_estiercol+otros_ingresos+cambio_stock_animales+cambio_stock_alimentos;

  const alimentos = d.alimentos_comprados*f*(1+s.alim)*(1+e.alim);
  const otros_basicos = KEYS_BASICOS_NO_ALIM.reduce((a,key) => a+(+d[key]||0), 0)*f*(1+s.otros);
  const mano_obra = (d.mano_obra_fija+d.mano_obra_temporal)*f*(1+s.mo);
  const admin_fin = (d.administracion+d.intereses_prestamos)*f*(1+s.otros);
  const depreciacion = (d.depreciacion_maquinaria+d.depreciacion_instalaciones+d.depreciacion_animales)*f;
  const gastos_basicos = alimentos+otros_basicos;
  const gastos_adicionales = mano_obra+admin_fin+depreciacion;
  const total_gastos = gastos_basicos+gastos_adicionales;

  const total_inversiones = d.inversiones_instalaciones+d.inversiones_maquinaria+d.inversiones_animales+d.inversiones_tierra;
  const lucro = total_ingresos-total_gastos;
  const costo_litro = volumen>0 ? total_gastos/volumen : 0;
  const margen_op = precio>0 ? (precio-costo_litro)/precio : 0;
  const beneficio_leche = venta_leche-total_gastos;
  const leche_eq = precio>0 ? total_ingresos/precio : 0;
  const leche_eq_kg = leche_eq*eqFactor;
  const l_vaca_dia = d.vacas>0 ? volumen/(d.vacas*dias) : 0;
  const eo = d.potencial_genetico>0 ? l_vaca_dia/d.potencial_genetico : 0;
  const roi_leche = total_inversiones>0 ? beneficio_leche/total_inversiones : 0;
  const roi_total = total_inversiones>0 ? lucro/total_inversiones : 0;
  const part_alim = total_gastos>0 ? alimentos/total_gastos : 0;
  const part_mo = total_gastos>0 ? mano_obra/total_gastos : 0;

  return {
    n, f, dias, precio, volumen, venta_leche, venta_animales, venta_estiercol, otros_ingresos,
    cambio_stock_animales, cambio_stock_alimentos, total_ingresos,
    alimentos, otros_basicos, mano_obra, admin_fin, depreciacion,
    gastos_basicos, gastos_adicionales, total_gastos, total_inversiones,
    lucro, costo_litro, margen_op, margen_por_litro: precio-costo_litro, beneficio_leche,
    roi_leche, roi_total, roi_leche_anual: roi_leche*n, roi_total_anual: roi_total*n,
    leche_eq, leche_eq_kg,
    leche_eq_vaca: d.vacas>0 ? leche_eq/d.vacas : 0, leche_eq_ha: d.area>0 ? leche_eq/d.area : 0,
    costo_100kg_leq: leche_eq_kg>0 ? total_gastos/leche_eq_kg*100 : 0,
    precio_min: costo_litro, bc: total_gastos>0 ? total_ingresos/total_gastos : 0,
    l_vaca_dia, eo, brecha: 1-eo,
    litros_por_empleado: d.empleados>0 ? volumen/d.empleados : 0,
    productividad_por_vaca: d.vacas>0 ? volumen/d.vacas : 0,
    productividad_por_hectarea: d.area>0 ? volumen/d.area : 0,
    part_alim, part_mo, part_otros: 1-part_alim-part_mo,
    // alias de compatibilidad con la versión anterior
    costo_produccion_litro: costo_litro, retorno_capital: roi_total*100
  };
}
function getCalculations(){ return modelo(); }

// =====================================================================
// 4. COMPONENTES
// =====================================================================
function createIcon(iconName, size=16, className=''){
  return `<i data-lucide="${iconName}" class="w-${size/4} h-${size/4} ${className}"></i>`;
}
function createKPICard(title, valor, icon, color='green', sub=''){
  return `<div class="bg-white p-4 rounded-lg shadow-md"><div class="flex items-center justify-between gap-2">
    <div class="min-w-0"><p class="text-sm font-medium text-gray-600">${title}</p>
    <p class="text-2xl font-bold text-${color}-600 num">${valor}</p>
    ${sub ? `<p class="text-xs text-gray-500 mt-1">${sub}</p>` : ''}</div>
    ${createIcon(icon,32,`text-${color}-600 shrink-0`)}</div></div>`;
}
function createInputField(label, value, field, type='number', min=0, tooltip='', readonly=false){
  const tip = tooltip ? `<span class="ml-1 text-gray-400" title="${esc(tooltip)}">${createIcon('info',14,'inline')}</span>` : '';
  let hint = '';
  if (type==='number' && Math.abs(value)>=10000){
    hint = `<p class="text-xs text-gray-500 mt-1 num">≈ ${field==='volumen' ? fmtNum(value)+' L' : fmtCOP(value)}</p>`;
  }
  const shown = type==='number' ? (readonly ? Math.round(value) : value) : esc(value);
  const onch = type==='number' ? 'parseFloat(this.value) || 0' : 'this.value';
  return `<div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">${label}${tip}${readonly ? ' <span class="text-xs text-blue-600">(automático)</span>' : ''}</label>
    <input type="${type}" value="${shown}" ${type==='number' ? `min="${min}" step="any"` : ''} ${readonly ? 'readonly' : ''}
      onchange="updateData('${field}', ${onch})"
      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 ${readonly ? 'bg-gray-100 cursor-not-allowed' : ''}"/>
    ${hint}</div>`;
}
function createSimpleChart(title, data, formatter){
  const fmt = formatter || (v => Math.abs(v)>=1e6 ? fmtMill(v) : fmtNum(v));
  const max = Math.max(...data.map(d => Math.abs(d.value)), 0);
  const items = data.map(item => {
    const pct = max>0 ? Math.abs(item.value)/max*100 : 0;
    return `<div class="flex items-center justify-between gap-2">
      <span class="text-sm text-gray-600">${item.label}</span>
      <div class="flex items-center space-x-2">
        <div class="w-32 bg-gray-200 rounded-full h-2"><div class="${item.value<0?'bg-red-500':'bg-green-500'} h-2 rounded-full progress-bar" style="width:${pct}%"></div></div>
        <span class="text-sm font-medium w-28 text-right num">${fmt(item.value)}</span>
      </div></div>`;
  }).join('');
  return `<div class="bg-white p-4 rounded-lg shadow-md mb-4"><h4 class="text-lg font-semibold mb-3 text-gray-800">${title}</h4><div class="space-y-2">${items}</div></div>`;
}
function fila(label, val, cls='font-medium'){
  return `<div class="flex justify-between gap-4"><span class="text-gray-600">${label}</span><span class="${cls} num text-right">${val}</span></div>`;
}
function tarjeta(titulo, cuerpo, extra=''){
  return `<div class="bg-white p-6 rounded-lg shadow-md ${extra}"><h3 class="text-xl font-bold text-gray-800 mb-4">${titulo}</h3>${cuerpo}</div>`;
}
function colorMargen(m){ return m<0 ? 'red' : m<0.05 ? 'orange' : m<0.12 ? 'yellow' : 'green'; }
function estadoMargen(m){
  if (m<0) return 'Pérdida: el precio no cubre el costo';
  if (m<0.05) return 'Zona crítica: la finca queda al borde de la pérdida';
  if (m<0.15) return 'Margen estrecho: vulnerable a choques de precio';
  return 'Margen saludable';
}

// =====================================================================
// 5. SEGMENTACIÓN TEMPORAL Y ESTACIONALIDAD
// =====================================================================
function updatePeriodoControls(){
  document.getElementById('sel-periodo').value = periodo.tipo;
  const sel = document.getElementById('sel-sub');
  sel.innerHTML = NOMBRES_SUB[periodo.tipo].map((nm,i) => `<option value="${i}" ${i===periodo.sub?'selected':''}>${nm}</option>`).join('');
  sel.disabled = periodo.tipo==='anual';
  document.getElementById('periodo-badge').textContent = 'Mostrando: ' + etiquetaPeriodo();
}
function setPeriodo(t){ periodo.tipo = t; periodo.sub = 0; updatePeriodoControls(); renderEstacPanel(); renderTabContent(); }
function setSub(k){ periodo.sub = +k; updatePeriodoControls(); renderTabContent(); }
function toggleEstac(){ document.getElementById('estac-panel').classList.toggle('hidden'); renderEstacPanel(); }

function renderEstacPanel(){
  const el = document.getElementById('estac-panel');
  if (periodo.tipo==='anual'){
    el.innerHTML = `<p class="text-sm">La estacionalidad se aplica en los análisis semestral y trimestral. Seleccione uno de esos periodos para definir el índice δt de cada subperiodo.</p>`;
    return;
  }
  const t = periodo.tipo, n = DIV[t];
  const vars = [['prod','Producción de leche'],['precio','Precio de la leche'],['alim','Costo de alimentación']];
  const filas = vars.map(([v,nm]) => {
    const celdas = estac[t][v].map((val,k) => `<td class="px-2 py-2 min-w-[9rem]">
      <input type="range" min="-20" max="20" step="1" value="${val}" oninput="setEstac('${v}',${k},this.value)">
      <div class="text-center text-xs num" id="e-${v}-${k}">${fmtSigned(val,0)}</div></td>`).join('');
    const prom = estac[t][v].reduce((a,b)=>a+b,0)/n;
    return `<tr><td class="text-sm font-medium pr-3">${nm}</td>${celdas}<td class="text-xs text-center num" id="e-avg-${v}">${fmtSigned(prom,1)}</td></tr>`;
  }).join('');
  el.innerHTML = `
    <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
      <h4 class="font-semibold">Índices de estacionalidad δt (${t})</h4>
      <div class="flex gap-2">
        ${t==='trimestral' ? `<button onclick="presetEstac()" class="px-3 py-1 text-xs bg-green-100 text-green-800 rounded">Ejemplo trópico alto bimodal (ilustrativo)</button>` : ''}
        <button onclick="resetEstac()" class="px-3 py-1 text-xs bg-gray-100 rounded">Restablecer a 0</button>
      </div>
    </div>
    <table><thead><tr><th></th>${CORTO_SUB[t].map(c=>`<th class="text-xs">${c}</th>`).join('')}<th class="text-xs">Promedio</th></tr></thead><tbody>${filas}</tbody></table>

function vistaTemporal(){
  const tipo = periodo.tipo==='anual' ? 'trimestral' : periodo.tipo;
  const n = DIV[tipo];
  const cols = Array.from({length:n}, (_,k) => modelo(SIM_CERO, k, tipo));
  const anual = modelo(SIM_CERO, 0, 'anual');
  const suma = key => cols.reduce((a,c) => a+c[key], 0);
  const vol = suma('volumen'), vl = suma('venta_leche'), g = suma('total_gastos'), ing = suma('total_ingresos');
  const pProm = vol>0 ? vl/vol : 0, cProm = vol>0 ? g/vol : 0;
  const filas = [
    ['Producción (L)', c => fmtNum(c.volumen), fmtNum(vol)],
    ['Precio ($/L)', c => fmtCOP(c.precio), fmtCOP(pProm)],
    ['Ingresos', c => fmtMill(c.total_ingresos), fmtMill(ing)],
    ['Gastos', c => fmtMill(c.total_gastos), fmtMill(g)],
    ['Resultado', c => fmtMill(c.lucro), fmtMill(ing-g)],
    ['Costo por litro', c => fmtCOP(c.costo_litro), fmtCOP(cProm)],
    ['Margen operativo', c => fmtPct(c.margen_op), fmtPct(pProm>0 ? (pProm-cProm)/pProm : 0)],
    ['L/vaca/día', c => fmtNum(c.l_vaca_dia,1), fmtNum(vol/(appData.vacas*365),1)]
  ];
  const dif = anual.total_ingresos>0 ? (ing-anual.total_ingresos)/anual.total_ingresos : 0;
  return tarjeta(periodo.tipo==='anual' ? 'Vista temporal: desagregación trimestral de referencia' : `Vista temporal ${tipo}`, `
    <div class="overflow-x-auto"><table class="tabla w-full text-sm num">
      <thead><tr><th class="text-left">Indicador</th>${CORTO_SUB[tipo].map((s,k) => `<th class="${periodo.tipo!=='anual' && k===periodo.sub ? 'bg-green-100' : ''}">${s}</th>`).join('')}<th>Total / promedio</th></tr></thead>
      <tbody>${filas.map(([nm,fn,tot]) => `<tr><td class="text-left">${nm}</td>${cols.map((c,k) => `<td class="text-right ${periodo.tipo!=='anual' && k===periodo.sub ? 'bg-green-50' : ''}">${fn(c)}</td>`).join('')}<td class="text-right font-semibold">${tot}</td></tr>`).join('')}</tbody>
    </table></div>
    ${Math.abs(dif)>0.005 ? `<p class="text-xs text-orange-600 mt-2">Los índices de estacionalidad no promedian cero: la suma de subperiodos difiere del año base en ${fmtSigned(dif*100,1)}.</p>` : ''}
    <p class="text-xs text-gray-500 mt-2">Los gastos fijos y la depreciación se reparten en partes iguales; la producción, el precio y la alimentación siguen los índices δt.</p>`);
}

};
// Gastos como % de los ingresos (documento de planeación estratégica)

  alimentos_comprados:50, mano_obra:10, salud:2.5, reproduccion:1.5, consumibles:2, bst:3,
  otros_gastos_basicos:2.5, mantenimiento_instalaciones:1, mantenimiento_maquinas:3, impuestos:2.5, depreciacion:5

// Desglose por rubro, coherente con los agregados del modelo (periodo, estacionalidad y escenario)
function desglose(s = SIM_CERO, k = periodo.sub, tipo = periodo.tipo){
  const c = modelo(s, k, tipo), d = appData, f = c.f;
  const ingresos = [
    ['Venta de leche', c.venta_leche], ['Venta de animales', c.venta_animales], ['Venta de estiércol', c.venta_estiercol],
    ['Otros ingresos', c.otros_ingresos], ['Cambio inventario de animales', c.cambio_stock_animales],
    ['Cambio inventario de alimentos', c.cambio_stock_alimentos]
  ].map(([label, valor]) => ({label, valor}));
  const basicos = KEYS_BASICOS.map(key => ({
    label: ETIQ_GASTOS[key],
    valor: key==='alimentos_comprados' ? c.alimentos : (+d[key]||0)*f*(1+s.otros),
    ref: REF_PCT_INGRESOS[key]
  }));
  const adicionales = [
    {label:'Mano de obra (fija + temporal)', valor:c.mano_obra, ref:REF_PCT_INGRESOS.mano_obra},
    {label:'Administración', valor:d.administracion*f*(1+s.otros)},
    {label:'Intereses de préstamos', valor:d.intereses_prestamos*f*(1+s.otros)},
    {label:'Depreciación (maquinaria, instalaciones, vacas)', valor:c.depreciacion, ref:REF_PCT_INGRESOS.depreciacion}
  ];
  return {c, ingresos, basicos, adicionales};
}

// Indicadores económicos; los que relacionan flujos con capital se anualizan
function indicadoresEq(c){
  const d = appData, n = c.n, ing = c.total_ingresos, inv = c.total_inversiones;
  const deuda = Math.min(Math.max(+d.deuda||0, 0), inv), propio = inv - deuda;
  const kgEqAnual = c.leche_eq_kg * n;
  const mlrb = ing>0 ? c.lucro/ing : 0;              // Margen neto / ingresos brutos
  const rbct = inv>0 ? ing*n/inv : 0;                 // Ingresos brutos / capital total
  const ctcp = propio>0 ? inv/propio : NaN;           // Capital total / capital propio
  return {
    por100: v => c.leche_eq_kg>0 ? v*100/c.leche_eq_kg : 0,   // ec. 4.2
    ca: ing>0 ? c.alimentos/ing : 0,                          // CA%Rec
    mo: ing>0 ? c.mano_obra/ing : 0,                          // MO%Rec
    mlrb, rbct, ctcp,
    rscp: isFinite(ctcp) ? mlrb*rbct*ctcp : NaN,              // = lucro anualizado / capital propio
    roi: c.roi_total_anual,                                   // ec. 4.3
    deuda, propio, deudaInv: inv>0 ? deuda/inv : 0,
    invVaca: inv/d.vacas, deudaVaca: deuda/d.vacas,
    invKgEq: kgEqAnual>0 ? inv/kgEqAnual : 0,
    invKgEqL: kgEqAnual>0 && c.precio>0 ? inv/kgEqAnual/c.precio : 0,
    kgEqAnual
  };
}

function exportarIndicadoresEq(){
  const {c, ingresos, basicos, adicionales} = desglose();
  const I = indicadoresEq(c);
  const dec = x => String(x).replace('.', ',');
  const filas = [['Grupo','Concepto','$ periodo','$/100 kg EQ','% ingresos','Ref. % ingresos']];
  const add = (g, r) => filas.push([g, r.label, Math.round(r.valor), Math.round(I.por100(r.valor)),
    dec((c.total_ingresos>0 ? r.valor/c.total_ingresos*100 : 0).toFixed(2)), r.ref!=null ? dec(r.ref) : '']);
  ingresos.forEach(r => add('Ingresos', r));
  basicos.forEach(r => add('Gastos básicos', r));
  adicionales.forEach(r => add('Gastos adicionales', r));
  add('Total', {label:'Costo total', valor:c.total_gastos});
  add('Total', {label:'Lucro', valor:c.lucro});
  filas.push([]);
  filas.push(['Periodo', etiquetaPeriodo()]);
  filas.push(['Leche equivalente (kg)', Math.round(c.leche_eq_kg)]);
  filas.push(['Base de conversión (kg/L)', dec(eqFactor)]);
  const csv = filas.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n');
  descargar('\ufeff'+csv, 'indicadores_100kg_EQ.csv', 'text/csv;charset=utf-8');
}

function setDiag(k,v){ diag[k] = +v; document.getElementById('d-'+k).textContent = fmtNum(+v,2); renderDiag(); }
function renderDiag(){
  const c = modelo(), a = modelo(SIM_CERO,0,'anual');
  const el1 = document.getElementById('diag-eo'); if (!el1) return;
  const pot = appData.potencial_genetico;
  const litrosExtra = Math.max(pot-c.l_vaca_dia,0)*appData.vacas*c.dias;
  const costoCerrado = c.eo>0 ? c.costo_litro*Math.min(c.eo,1) : 0;
  const margenCerrado = c.precio>0 ? (c.precio-costoCerrado)/c.precio : 0;
  el1.innerHTML = `
    <div class="flex items-end gap-4 mb-3"><span class="text-5xl font-bold text-green-700 num">${fmtNum(c.eo,3)}</span><span class="text-sm text-gray-600 pb-2">${fmtNum(c.l_vaca_dia,1)} de ${fmtNum(pot,1)} L/vaca/día</span></div>
    <div class="w-full bg-gray-200 rounded-full h-4 mb-4"><div class="bg-green-500 h-4 rounded-full" style="width:${Math.min(c.eo,1)*100}%"></div></div>
    <div class="space-y-2 text-sm">
      ${fila('Brecha frente al potencial', fmtPct(Math.max(c.brecha,0)))}
      ${fila('Litros adicionales si se cierra la brecha ('+etiquetaPeriodo()+')', fmtNum(litrosExtra)+' L')}
      ${fila('Ingreso adicional a precio actual', fmtCOP(litrosExtra*c.precio))}
      ${fila('Margen con la brecha cerrada (costo total constante)', fmtPct(margenCerrado))}
    </div>`;
  const F = {productividad:Math.min(c.eo,1), ...diag};
  const nombres = {productividad:'Productividad por vaca', alimentacion:'Costos de alimentación', calidad:'Calidad de leche', sanidad:'Sanidad', reproductiva:'Reproducción'};

function renderSensibilidad(){
  const el = document.getElementById('sens-results'); if (!el) return;
  const b = modelo(SIM_CERO);
  const defs = [
    {nm:'Precio de la leche', key:'precio', ctrl:'No controlable', res:'precio'},
    {nm:'Costo de alimentación', key:'alim', ctrl:'Parcialmente', res:'costo'},
    {nm:'Productividad por vaca', key:'prod', ctrl:'Controlable', res:'costo'},
    {nm:'Costo de mano de obra', key:'mo', ctrl:'Parcialmente', res:'costo'}
  ];
  const filas = defs.map(d => {
    const mag = sens[d.key];
    const sube = modelo({...SIM_CERO, [d.key]:mag/100}), baja = modelo({...SIM_CERO, [d.key]:-mag/100});
    const dSube = (sube.margen_op-b.margen_op)*100, dBaja = (baja.margen_op-b.margen_op)*100;
    return {...d, mag, sube, baja, dSube, dBaja, elast:Math.abs(dSube-dBaja)/(2*mag), rango:Math.abs(dSube-dBaja)};
  });
  const val = (r,m) => r.res==='precio' ? 'Precio '+fmtCOP(m.precio) : 'Costo '+fmtCOP(m.costo_litro);
  const tabla = `<table class="tabla w-full text-sm num"><thead><tr><th class="text-left">Escenario</th><th class="text-right">Precio o costo resultante ($/L)</th><th class="text-right">Margen</th><th class="text-right">Cambio (pts)</th></tr></thead><tbody>
    <tr><td>Caso base</td><td class="text-right">—</td><td class="text-right font-bold">${fmtPct(b.margen_op)}</td><td class="text-right">—</td></tr>
    ${filas.map(r => `
      <tr><td>${r.nm} +${r.mag} %</td><td class="text-right">${val(r,r.sube)}</td><td class="text-right font-semibold text-${colorMargen(r.sube.margen_op)}-600">${fmtPct(r.sube.margen_op)}</td><td class="text-right">${fmtSigned(r.dSube,1,'')}</td></tr>
      <tr><td>${r.nm} −${r.mag} %</td><td class="text-right">${val(r,r.baja)}</td><td class="text-right font-semibold text-${colorMargen(r.baja.margen_op)}-600">${fmtPct(r.baja.margen_op)}</td><td class="text-right">${fmtSigned(r.dBaja,1,'')}</td></tr>`).join('')}
  </tbody></table>`;
  const porRango = [...filas].sort((x,y) => y.rango-x.rango);
  const porElast = [...filas].sort((x,y) => y.elast-x.elast);
  const maxAbs = Math.max(...filas.flatMap(r => [Math.abs(r.dSube), Math.abs(r.dBaja)]), 0.001);
  const tornado = porRango.map(r => {
    const neg = Math.min(r.dSube, r.dBaja), pos = Math.max(r.dSube, r.dBaja);
    return `<div class="grid grid-cols-12 items-center gap-2 text-xs mb-2">
      <div class="col-span-3 text-right text-gray-700">${r.nm} (±${r.mag} %)</div>
      <div class="col-span-4 flex justify-end"><div class="bg-red-400 h-6 rounded-l flex items-center justify-start pl-1 text-white num" style="width:${Math.abs(neg)/maxAbs*100}%">${fmtNum(neg,1)}</div></div>
      <div class="col-span-4 flex border-l-2 border-gray-700"><div class="bg-green-500 h-6 rounded-r flex items-center justify-end pr-1 text-white num" style="width:${Math.abs(pos)/maxAbs*100}%">+${fmtNum(pos,1)}</div></div>
      <div class="col-span-1 text-gray-500 num">${fmtNum(r.elast,2)}</div></div>`;
  }).join('');
  const controlables = porElast.filter(r => r.ctrl!=='No controlable');
  const precio = filas.find(r => r.key==='precio');
  const precios = [-20,-15,-10,-5,0,5,10,15,20], prods = [15,10,5,0,-5,-10,-15];
  const bg = m => m<0?'#fecaca':m<0.05?'#fed7aa':m<0.12?'#fef08a':m<0.2?'#bbf7d0':'#86efac';
  const heat = `<table class="heat w-full num"><thead><tr><th class="text-gray-600">Prod. \\ Precio</th>${precios.map(p => `<th>${fmtSigned(p,0)}</th>`).join('')}</tr></thead><tbody>
    ${prods.map(pr => `<tr><th>${fmtSigned(pr,0)}</th>${precios.map(p => { const m = modelo({...SIM_CERO, precio:p/100, prod:pr/100}).margen_op; return `<td style="background:${bg(m)};${p===0&&pr===0?'outline:2px solid #111;':''}">${fmtNum(m*100,1)}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table>`;
  el.innerHTML = `
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
      <div>${tabla}</div>
      <div><h4 class="font-semibold mb-2">Diagrama de tornado (cambio en puntos de margen)</h4>
        <div class="grid grid-cols-12 text-xs text-gray-500 mb-1"><div class="col-span-3"></div><div class="col-span-4 text-right pr-1">empeora</div><div class="col-span-4 pl-1">mejora</div><div class="col-span-1">pts/1 %</div></div>
        ${tornado}
        <div class="bg-blue-50 text-blue-900 text-sm rounded p-3 mt-3 space-y-1">
          <p><b>Más sensible:</b> ${porElast[0].nm} (${fmtNum(porElast[0].elast,2)} pts por cada 1 %).</p>
          <p><b>Palanca controlable más fuerte:</b> ${controlables[0].nm} (${fmtNum(controlables[0].elast,2)} pts por cada 1 %).</p>
          <p><b>Asimetría del precio:</b> bajar ${precio.mag} % resta ${fmtNum(Math.abs(precio.dBaja),1)} pts; subir ${precio.mag} % suma ${fmtNum(precio.dSube,1)} pts.</p>
        </div></div>
    </div>
    <h4 class="font-semibold mt-6 mb-2">Mapa de margen operativo (%): precio × productividad</h4>
    ${heat}
    <p class="text-xs text-gray-500 mt-2">El recuadro negro es el caso base. Rojo: pérdida · naranja: &lt; 5 % · amarillo: &lt; 12 % · verde: ≥ 12 %.</p>`;
}

function randn(){ let u=0, v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function correrMonteCarlo(){
  const n = Math.min(Math.max(Math.round(mc.n),100),20000);
  const margenes = [], lucros = [];
  for (let i=0; i<n; i++){
    const s = {...sim,
      precio: Math.max(-0.9, sim.precio + randn()*mc.sdPrecio/100),
      alim: Math.max(-0.9, sim.alim + randn()*mc.sdAlim/100),
      prod: Math.max(-0.9, sim.prod + randn()*mc.sdProd/100)};
    const m = modelo(s);
    margenes.push(m.margen_op); lucros.push(m.lucro);
  }
  margenes.sort((a,b) => a-b); lucros.sort((a,b) => a-b);
  mc.resultado = {margenes, lucros, n, periodo:etiquetaPeriodo()};
  renderMC();
}
function renderMC(){
  const el = document.getElementById('mc-results'); if (!el) return;
  const r = mc.resultado;
  if (!r){ el.innerHTML = '<p class="text-sm text-gray-500">Presione «Simular» para generar la distribución.</p>'; return; }
  const arr = r.margenes, N = arr.length;
  const q = (a,p) => a[Math.min(N-1, Math.floor(p*N))];
  const media = arr.reduce((a,b) => a+b,0)/N;
  const sd = Math.sqrt(arr.reduce((a,b) => a+(b-media)**2,0)/N);
  const pPerd = arr.filter(m => m<0).length/N, pCrit = arr.filter(m => m<0.05).length/N;
  const nb = 24, min = arr[0], max = arr[N-1], w = (max-min)/nb || 0.001;
  const cuentas = Array(nb).fill(0); arr.forEach(m => cuentas[Math.min(nb-1, Math.floor((m-min)/w))]++);
  const cmax = Math.max(...cuentas);
  el.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-sm">
      ${[['Margen medio', fmtPct(media)], ['Desviación estándar', fmtNum(sd*100,1)+' pts'], ['Probabilidad de pérdida', fmtPct(pPerd)], ['Prob. margen < 5 %', fmtPct(pCrit)],
         ['Percentil 5', fmtPct(q(arr,0.05))], ['Mediana', fmtPct(q(arr,0.5))], ['Percentil 95', fmtPct(q(arr,0.95))], ['Resultado P5 – P95', fmtMill(q(r.lucros,0.05))+' a '+fmtMill(q(r.lucros,0.95))]]
        .map(([t,v]) => `<div class="border rounded p-2"><p class="text-xs text-gray-500">${t}</p><p class="font-bold num">${v}</p></div>`).join('')}
    </div>
    <div class="flex items-end gap-px h-40 border-b border-l border-gray-300">
      ${cuentas.map((c,i) => { const centro = min+(i+0.5)*w; return `<div title="${fmtPct(centro)}: ${c}" class="flex-1 ${centro<0?'bg-red-400':centro<0.05?'bg-orange-300':'bg-green-500'}" style="height:${c/cmax*100}%"></div>`; }).join('')}
    </div>
    <div class="flex justify-between text-xs text-gray-500 num mt-1"><span>${fmtPct(min)}</span><span>Distribución del margen operativo (${r.n} iteraciones, ${r.periodo})</span><span>${fmtPct(max)}</span></div>`;
}

// =====================================================================
// 10. MÓDULO: PLANIFICACIÓN
// =====================================================================
function tabPlanificacion(){
  const campos = [
    ['metaMargen','Meta de margen operativo (%)'],['caidaPrecio','Choque de precio a resistir (%)'],
    ['horizonte','Horizonte de proyección (años)'],['crecPrecio','Crecimiento anual del precio (%)'],
    ['inflCostos','Inflación anual de costos (%)'],['mejoraProd','Mejora anual de productividad (%)'],
    ['tasaDesc','Tasa de descuento ajustada por riesgo (%)']];
  return `<div class="space-y-6">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    ${tarjeta('Parámetros del plan', `
      ${campos.map(([k,nm]) => `<label class="block text-sm mb-3">${nm}<input type="number" step="any" value="${plan[k]}" onchange="setPlan('${k}',this.value)" class="w-full mt-1 px-3 py-2 border rounded-md"></label>`).join('')}
      <p class="text-xs text-gray-500">La planificación trabaja sobre la base anual. Horizontes: corto plazo 0–12 meses; mediano 12–36 meses; largo más de 5 años.</p>`)}
    <div class="lg:col-span-2 space-y-6"><div id="plan-results"></div></div>
  </div>
  ${tarjeta('Medidas de innovación del plan para «El Plan»', `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
    <div class="border rounded p-3"><p class="font-semibold text-green-800">Corto plazo (0–12 meses) · operacionales</p>
      <ul class="list-disc list-inside mt-1 text-gray-700"><li>Nutrición de precisión</li><li>Optimización de protocolos reproductivos</li><li>Mejor manejo de praderas y forrajes</li></ul></div>
    <div class="border rounded p-3"><p class="font-semibold text-blue-800">Mediano plazo (12–36 meses) · estructurales</p>
      <ul class="list-disc list-inside mt-1 text-gray-700"><li>Mejoramiento genético</li><li>Infraestructura productiva</li><li>Tecnologías de precisión</li></ul></div>
  </div>`)}
  </div>`;
}
function setPlan(k,v){ plan[k] = +v || 0; if (k==='horizonte') plan.horizonte = Math.min(Math.max(Math.round(plan.horizonte),1),20); renderPlan(); }
function renderPlan(){
  const el = document.getElementById('plan-results'); if (!el) return;
  const a = modelo(SIM_CERO, 0, 'anual');
  const P = a.precio, C = a.costo_litro, m0 = a.margen_op, L = a.l_vaca_dia, pot = appData.potencial_genetico;
  const mMeta = plan.metaMargen/100;
  const cReq = P*(1-mMeta), redC = C-cReq, prodReq = C/cReq-1, Lreq = L*(1+prodReq);
  const P2 = P*(1-plan.caidaPrecio/100), cReq2 = P2*(1-m0), prodReq2 = C/cReq2-1, Lreq2 = L*(1+prodReq2);
  const smart = `Aumentar la producción promedio de ${fmtNum(L,1)} a ${fmtNum(Lreq,1)} L/vaca/día en los próximos 12 meses, mediante ajuste de la dieta y del programa reproductivo, sin aumentar el costo total anual, para llevar el margen operativo de ${fmtPct(m0)} a ${fmtPct(mMeta)}.`;
  const r = plan.tasaDesc/100, otrosIng = a.total_ingresos-a.venta_leche;
  let vpn = 0, vpnSin = 0, topado = false;
  const filas = [];
  for (let t=1; t<=plan.horizonte; t++){
    const gP = (1+plan.crecPrecio/100)**t, gC = (1+plan.inflCostos/100)**t;
    let Lt = L*(1+plan.mejoraProd/100)**t;
    if (Lt>pot){ Lt = Math.max(pot, L); topado = true; }
    const vol = appData.vacas*365*Lt;
    const ing = vol*P*gP + otrosIng*gP, cos = a.total_gastos*gC, ben = ing-cos, vp = ben/(1+r)**t;
    const benSin = appData.volumen*P*gP + otrosIng*gP - cos;
    vpn += vp; vpnSin += benSin/(1+r)**t;
    filas.push({t, Lt, vol, ing, cos, ben, vp, margen:(P*gP - cos/vol)/(P*gP), hz: t<=1?'Corto':t<=3?'Mediano':'Largo'});
  }
  el.innerHTML = `
    ${tarjeta('Meta de margen: ¿qué se necesita para alcanzarla?', `
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm mb-4">
        <div class="border rounded p-3"><p class="text-xs text-gray-500">Costo requerido</p><p class="text-xl font-bold num">${fmtCOP(cReq)}/L</p><p class="text-xs">Reducción de ${fmtCOP(redC)}/L frente a ${fmtCOP(C)}/L</p></div>
        <div class="border rounded p-3"><p class="text-xs text-gray-500">O bien, productividad requerida</p><p class="text-xl font-bold num">${fmtSigned(prodReq*100,1)}</p><p class="text-xs">${fmtNum(L,1)} → ${fmtNum(Lreq,1)} L/vaca/día, costo total constante</p></div>
        <div class="border rounded p-3 ${Lreq>pot?'bg-orange-50':'bg-green-50'}"><p class="text-xs text-gray-500">Frente al potencial genético</p><p class="text-xl font-bold num">${fmtNum(pot,1)} L/día</p><p class="text-xs">${Lreq>pot ? 'La meta supera el potencial: combine productividad con reducción de costos.' : 'La meta cabe dentro del potencial del hato.'}</p></div>
      </div>
      <div class="bg-green-50 border-l-4 border-green-600 p-3 text-sm"><p class="font-semibold text-green-800 mb-1">Meta SMART sugerida</p><p>${smart}</p></div>
      <div class="bg-orange-50 border-l-4 border-orange-500 p-3 text-sm mt-3"><p class="font-semibold text-orange-800 mb-1">Resistencia a un choque de precio del −${fmtNum(plan.caidaPrecio,0)} %</p>
        <p>Con el precio en ${fmtCOP(P2)}/L, mantener el margen actual (${fmtPct(m0)}) exige un costo de ${fmtCOP(cReq2)}/L, es decir, subir la productividad ${fmtSigned(prodReq2*100,1)} hasta ${fmtNum(Lreq2,1)} L/vaca/día${Lreq2>pot ? ', por encima del potencial genético: la productividad amortigua la volatilidad, pero no la compensa sola' : ''}.</p></div>`)}
    ${tarjeta(`Proyección a ${plan.horizonte} años y valor presente`, `
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4 text-sm">
        <div class="border rounded p-3"><p class="text-xs text-gray-500">VPN con el plan de productividad</p><p class="text-xl font-bold num">${fmtMill(vpn)}</p></div>
        <div class="border rounded p-3"><p class="text-xs text-gray-500">VPN sin mejora de productividad</p><p class="text-xl font-bold num">${fmtMill(vpnSin)}</p></div>
        <div class="border rounded p-3 bg-green-50"><p class="text-xs text-gray-500">Valor del programa</p><p class="text-xl font-bold num text-green-700">${fmtMill(vpn-vpnSin)}</p></div>
      </div>
      <div class="overflow-x-auto"><table class="tabla w-full text-sm num"><thead><tr><th>Año</th><th>Horizonte</th><th>L/vaca/día</th><th>Ingresos</th><th>Costos</th><th>Beneficio</th><th>Margen</th><th>Valor presente</th></tr></thead><tbody>
        ${filas.map(f => `<tr><td class="text-center">${f.t}</td><td class="text-center text-xs">${f.hz}</td><td class="text-right">${fmtNum(f.Lt,1)}</td><td class="text-right">${fmtMill(f.ing)}</td><td class="text-right">${fmtMill(f.cos)}</td><td class="text-right ${f.ben<0?'text-red-600':''}">${fmtMill(f.ben)}</td><td class="text-right">${fmtPct(f.margen)}</td><td class="text-right">${fmtMill(f.vp)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="text-xs text-gray-500 mt-2">R<sub>lt</sub> = Σ (I<sub>t</sub> − C<sub>t</sub>) / (1 + r)<sup>t</sup>. Supuestos: el costo total crece solo con la inflación; la productividad adicional no aumenta el costo total${topado ? '; la producción se limita al potencial genético' : ''}.</p>`)}`;
}

// =====================================================================
// 11. ANÁLISIS IA (conservado y ampliado con escenario y periodo)
// =====================================================================
function tabAnalisis(c){
  let cuerpo = '<p class="text-gray-600">Presione «Analizar con IA» para obtener un diagnóstico con base en los datos, el periodo y el escenario actual del simulador.</p>';
  if (isAnalyzing) cuerpo = '<p class="text-indigo-700">Analizando…</p>';
  else if (aiAnalysis && aiAnalysis.error) cuerpo = `<p class="text-red-600">${esc(aiAnalysis.error)}</p>`;
  else if (aiAnalysis){
    const lista = (t,arr,cl) => arr && arr.length ? `<div class="${cl} p-4 rounded-lg"><h4 class="font-semibold mb-2">${t}</h4><ul class="list-disc list-inside space-y-1">${arr.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>` : '';
    cuerpo = `<div class="space-y-4">
      ${aiAnalysis.resumen ? `<div class="bg-white p-4 rounded-lg"><p>${esc(aiAnalysis.resumen)}</p></div>` : ''}
      ${lista('Fortalezas', aiAnalysis.fortalezas, 'bg-green-50 text-green-800')}
      ${lista('Debilidades', aiAnalysis.debilidades, 'bg-red-50 text-red-800')}
      ${lista('Recomendaciones', aiAnalysis.recomendaciones, 'bg-blue-50 text-blue-800')}</div>`;
  }
  return `<div class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      ${createKPICard('Margen operativo', fmtPct(c.margen_op), 'pie-chart', colorMargen(c.margen_op), etiquetaPeriodo())}
      ${createKPICard('Eficiencia operativa', fmtPct(c.eo), 'activity', 'blue')}
      ${createKPICard('Costo por 100 kg EQ', fmtCOP(c.costo_100kg_leq), 'calculator', 'purple')}
      ${createKPICard('Escenarios guardados', fmtNum(escenarios.length), 'sliders', 'orange')}
    </div>
    <div class="bg-gradient-to-br from-blue-50 to-indigo-50 p-6 rounded-lg shadow-md">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold text-gray-800 flex items-center">${createIcon('brain',24,'mr-2 text-indigo-600')}Análisis inteligente</h3>
        <button onclick="analyzeWithAI()" ${isAnalyzing?'disabled':''} class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 disabled:opacity-50">Analizar con IA</button>
      </div>${cuerpo}</div></div>`;
}
async function analyzeWithAI(){
  if (!window.claude || !window.claude.complete){ alert('La función de análisis IA solo está disponible cuando el aplicativo se ejecuta dentro de Claude.'); return; }
  isAnalyzing = true; renderTabContent();
  const c = modelo(), s = modelo(sim), I = indicadoresEq(c);
  const prompt = `Analiza esta finca lechera de ${appData.region}, Colombia (sistema: ${appData.sistema_produccion}). Periodo: ${etiquetaPeriodo()}.
DATOS: ${appData.vacas} vacas, ${appData.area} ha, ${appData.empleados} empleados, ${fmtNum(c.l_vaca_dia,1)} L/vaca/día frente a potencial de ${appData.potencial_genetico} L.
RESULTADOS DEL PERIODO: ingresos ${fmtCOP(c.total_ingresos)}, gastos ${fmtCOP(c.total_gastos)}, resultado ${fmtCOP(c.lucro)}.
INDICADORES: precio ${fmtCOP(c.precio)}/L, costo ${fmtCOP(c.costo_litro)}/L, margen operativo ${fmtPct(c.margen_op)}, eficiencia operativa ${fmtPct(c.eo)}, leche equivalente ${fmtNum(c.leche_eq_kg)} kg, ROI de la leche anualizado ${fmtPct(c.roi_leche_anual)}, alimentación ${fmtPct(c.part_alim)} del costo, mano de obra ${fmtPct(c.part_mo)}.
POR 100 kg EQ: costo total ${fmtCOP(I.por100(c.total_gastos))}, lucro ${fmtCOP(I.por100(c.lucro))}. CA%Rec ${fmtPct(I.ca)}, MO%Rec ${fmtPct(I.mo)}, MLRb ${fmtPct(I.mlrb)}, RbCt ${fmtNum(I.rbct,2)}, CtCp ${isFinite(I.ctcp)?fmtNum(I.ctcp,2):'—'}, RSCp ${isFinite(I.rscp)?fmtPct(I.rscp):'—'}.
ESCENARIO SIMULADO: precio ${fmtSigned(sim.precio*100,0)}, alimentación ${fmtSigned(sim.alim*100,0)}, productividad ${fmtSigned(sim.prod*100,0)}, mano de obra ${fmtSigned(sim.mo*100,0)} → margen ${fmtPct(s.margen_op)}.
Responde SOLO con un JSON válido, sin texto adicional: {"resumen":"...","fortalezas":["..."],"debilidades":["..."],"recomendaciones":["..."]}`;
  try {
    const resp = await window.claude.complete(prompt);
    const txt = String(resp).replace(/```json|```/g,'').trim();
    aiAnalysis = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}')+1));
  } catch(e){ aiAnalysis = {error:'No fue posible interpretar la respuesta: '+e.message}; }
  isAnalyzing = false; renderTabContent();
}

// =====================================================================
// 12. RESPALDO DE DATOS
// =====================================================================
function restaurarElPlan(){
  if (!confirm('¿Reemplazar los datos actuales por el caso «El Plan»?')) return;
  appData = JSON.parse(JSON.stringify(CASO_EL_PLAN)); renderTabContent();
}
function exportarJSON(){
  calculateAutomaticValues();
  descargar(JSON.stringify({appData, estac, plan, diag, escenarios, eqFactor}, null, 2), 'finca_gestion_lechera.json', 'application/json');
}
function importarJSON(ev){
  const file = ev.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (o.appData) appData = {...CASO_EL_PLAN, ...o.appData};
      if (o.estac) estac = o.estac;
      if (o.plan) plan = {...plan, ...o.plan};
      if (o.diag) diag = {...diag, ...o.diag};
      if (Array.isArray(o.escenarios)) escenarios = o.escenarios;
      if (o.eqFactor) eqFactor = +o.eqFactor;
      renderEstacPanel(); renderTabContent();
    } catch(e){ alert('Archivo no válido: '+e.message); }
  };
  rd.readAsText(file);
}

// =====================================================================
// 13. NAVEGACIÓN Y RENDER
// =====================================================================
function renderTabs(){
  document.getElementById('tab-navigation').innerHTML = tabs.map(tab => `
    <button onclick="setActiveTab('${tab.id}')" class="flex items-center px-5 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${activeTab===tab.id?'tab-active':'tab-inactive'}">
      ${savedSections.has(tab.id) ? createIcon('check-circle',14,'mr-1 text-green-600') : ''}${createIcon(tab.icon,16,'mr-2')}${tab.label}</button>`).join('');
}
function renderTabContent(){
  const c = getCalculations();
  const map = {datos_generales:tabDatos, ingresos:tabIngresos, gastos:tabGastos, inversiones:tabInversiones,
    resultados:tabResultados, indicadores_eq:tabIndicadoresEq, diagnostico:tabDiagnostico,
    simulador:tabSimulador, planificacion:tabPlanificacion, analisis:tabAnalisis};
  document.getElementById('tab-content').innerHTML = map[activeTab](c);
  if (activeTab==='simulador'){ renderSimResults(); renderEscenarios(); renderSensibilidad(); renderMC(); }
  if (activeTab==='diagnostico') renderDiag();
  if (activeTab==='planificacion') renderPlan();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}
function setActiveTab(id){ activeTab = id; renderTabs(); renderTabContent(); updateNavigationButtons(); window.scrollTo({top:0, behavior:'smooth'}); }
function updateData(field, value){ appData[field] = value; renderTabContent(); }
function navigateTab(dir){
  const cur = tabs.find(t => t.id===activeTab).order, nuevo = cur+dir;
  if (nuevo>=0 && nuevo<tabs.length){ saveCurrentData(); setActiveTab(tabs.find(t => t.order===nuevo).id); }
}
function saveCurrentData(){
  savedSections.add(activeTab); updateProgress(); renderTabs();
  const b = document.getElementById('save-button'), st = document.getElementById('save-status');
  b.classList.add('pulse-save'); st.textContent = '✅ Datos guardados'; st.style.color = '#10b981';
  setTimeout(() => { b.classList.remove('pulse-save'); st.textContent = ''; }, 2000);
  if (typeof lucide !== 'undefined') lucide.createIcons();
}
function updateProgress(){
  document.getElementById('progress-bar').style.width = `${savedSections.size/tabs.length*100}%`;
  document.getElementById('progress-text').textContent = `${savedSections.size}/${tabs.length} secciones completadas`;
}
function updateNavigationButtons(){
  const cur = tabs.find(t => t.id===activeTab).order;
  const prev = document.getElementById('prev-button'), next = document.getElementById('next-button');
  prev.disabled = cur===0;
  if (cur===tabs.length-1){
    next.textContent = 'Finalizar';
    next.onclick = () => { saveCurrentData(); alert('¡Registro completado! Todos los datos han sido guardados.'); };
  } else { next.textContent = 'Siguiente →'; next.onclick = () => navigateTab(1); }
}

document.addEventListener('DOMContentLoaded', () => {
  calculateAutomaticValues();
  updatePeriodoControls();
  renderTabs(); renderTabContent(); updateNavigationButtons(); updateProgress();
});
</script>
